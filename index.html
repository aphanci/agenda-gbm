<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Agenda — Journées Portes Ouvertes GBM</title>

    <!-- Couleur de la barre système du téléphone quand l'app est installée -->
    <meta name="theme-color" content="#0C2340">

    <!-- Le manifeste : c'est lui qui rend la page installable -->
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="icones/icone-192.png">
    <link rel="apple-touch-icon" href="icones/icone-192.png">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
    <link rel="stylesheet" href="style.css">
  </head>

  <body>
    <div class="wrap">

      <!-- ===== Bandeau de l'événement ===== -->
      <header class="masthead">
        <div class="langsw" role="group" aria-label="Langue / Language">
          <button type="button" id="btnFr" aria-pressed="true">FR</button>
          <button type="button" id="btnEn" aria-pressed="false">EN</button>
        </div>
        <p class="eyebrow" id="mSurtitre"></p>
        <h1 id="mTitre"></h1>
        <div class="meta">
          <span id="mTheme"></span>
          <span id="mLieu"></span>
        </div>
      </header>

      <!-- ===== Bandeau d'annonce (masqué tant qu'il n'y a rien à dire) ===== -->
      <div class="annonce" id="annonce" hidden role="status">
        <span class="annonce-tag" id="annonceTag"></span>
        <p id="annonceTexte"></p>
      </div>

      <!-- ===== Barre de statut : que se passe-t-il maintenant ? ===== -->
      <section class="status" id="status" aria-live="polite">
        <span class="status-kicker" id="statusKicker"></span>
        <p class="status-titre" id="statusTitre"></p>
        <p class="status-sous" id="statusSous"></p>
        <p class="status-aussi" id="statusAussi" hidden></p>
      </section>

      <!-- ===== Invitation à s'enregistrer ===== -->
      <div class="inscrire" id="inscrireBandeau" hidden>
        <div class="inscrire-txt">
          <p class="inscrire-titre" id="inscrireTitre"></p>
          <p class="inscrire-detail" id="inscrireDetail"></p>
        </div>
        <button class="inscrire-go" id="inscrireOuvrir" type="button"></button>
        <button class="inscrire-x" id="inscrireMasquer" type="button"></button>
      </div>

      <!-- ===== Onglets des journées ===== -->
      <div class="tabs" role="tablist" id="tabs"></div>

      <div class="daybar">
        <p class="sous-titre" id="sousTitre"></p>
        <button class="filtre" id="btnFiltre" type="button" aria-pressed="false">
          <span aria-hidden="true">★</span> <span id="filtreLabel"></span>
        </button>
      </div>

      <!-- ===== La liste des sessions ===== -->
      <ul class="rail" id="rail"></ul>

      <!-- ===== Informations pratiques ===== -->
      <section class="infos">
        <h2 id="infosTitre"></h2>
        <dl id="infosListe"></dl>

        <details class="howto">
          <summary id="howtoTitre"></summary>
          <div id="howtoCorps"></div>
        </details>

        <p class="credit" id="credit"></p>
      </section>

    </div>

    <button class="jump" id="btnJump" type="button" hidden>
      <i></i> <span id="jumpLabel"></span>
    </button>

    <!-- Bandeau d'installation. Masqué par défaut : le JavaScript décide
         s'il doit apparaître, et sous quelle forme, selon le téléphone. -->
    <aside class="install" id="install" hidden>
      <div class="install-ico" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
             stroke-linecap="round" stroke-linejoin="round">
          <rect x="5" y="2" width="14" height="20" rx="2.5"></rect>
          <line x1="10.5" y1="18.5" x2="13.5" y2="18.5"></line>
        </svg>
      </div>
      <div class="install-txt">
        <p class="install-titre" id="installTitre"></p>
        <p class="install-detail" id="installDetail"></p>
      </div>
      <button class="install-go" id="installGo" type="button" hidden></button>
      <button class="install-x" id="installX" type="button"></button>
    </aside>

    <!-- ===== Le formulaire d'enregistrement, en plein écran ===== -->
    <div class="panneau" id="inscrirePanneau" hidden role="dialog" aria-modal="true"
         aria-labelledby="formTitre">
      <div class="panneau-boite">

        <header class="panneau-tete">
          <h2 id="formTitre"></h2>
          <button class="panneau-x" id="formFermer" type="button"></button>
        </header>

        <!-- Mode « formulaire Microsoft » : ton introduction et ton avis,
             puis le formulaire de Microsoft dans un cadre. -->
        <div class="cadre-zone" id="cadreZone" hidden>
          <p class="form-intro" id="cadreIntro"></p>

          <section class="avis">
            <h3 id="cadreAvisTitre"></h3>
            <p id="cadreAvisTexte"></p>
          </section>

          <div class="cadre-boite">
            <iframe id="cadreForm" title="" loading="lazy"
                    allow="fullscreen" referrerpolicy="no-referrer"></iframe>
          </div>

          <button type="button" class="form-envoyer" id="cadreTermine"></button>
          <p class="form-note" id="cadreNote"></p>
        </div>

        <form class="form" id="formInscription" novalidate>
          <p class="form-intro" id="formIntro"></p>

          <div class="duo">
            <label class="champ">
              <span class="champ-nom" id="labNom"></span>
              <input type="text" id="fNom" name="nom" autocomplete="family-name" required>
            </label>

            <label class="champ">
              <span class="champ-nom" id="labPrenom"></span>
              <input type="text" id="fPrenom" name="prenom" autocomplete="given-name" required>
            </label>
          </div>

          <label class="champ">
            <span class="champ-nom" id="labQualite"></span>
            <select id="fQualite" name="qualite" required></select>
          </label>

          <label class="champ" id="champAutre" hidden>
            <span class="champ-nom" id="labAutre"></span>
            <input type="text" id="fAutre" name="autre">
          </label>

          <label class="champ">
            <span class="champ-nom" id="labOrganisation"></span>
            <input type="text" id="fOrganisation" name="organisation" autocomplete="organization">
          </label>

          <label class="champ">
            <span class="champ-nom" id="labEmail"></span>
            <input type="email" id="fEmail" name="email" autocomplete="email" inputmode="email" required>
          </label>

          <!-- L'avis de confidentialité, écrit depuis programme.json -->
          <section class="avis">
            <h3 id="avisTitre"></h3>
            <p id="avisTexte"></p>
            <p id="avisDroits"></p>
          </section>

          <label class="consent">
            <input type="checkbox" id="fConsent" name="consent" required>
            <span id="labConsent"></span>
          </label>

          <p class="form-erreur" id="formErreur" hidden role="alert"></p>

          <button type="submit" class="form-envoyer" id="formEnvoyer"></button>
          <p class="form-note" id="formNote"></p>
        </form>

        <!-- L'écran de confirmation, une fois l'envoi réussi -->
        <div class="merci" id="formMerci" hidden>
          <div class="merci-ico" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round">
              <path d="M20 6L9 17l-5-5"></path>
            </svg>
          </div>
          <h3 id="merciTitre"></h3>
          <p id="merciTexte"></p>
          <button type="button" class="merci-go" id="merciFermer"></button>
        </div>

      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
