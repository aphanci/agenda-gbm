<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Agenda — Journées Portes Ouvertes GBM</title>

    <!-- Couleur de la barre système du téléphone quand l'app est installée.
         Elle porte un id : le JavaScript la change avec le thème, sinon on
         aurait une barre sombre au-dessus d'une page claire. -->
    <meta name="theme-color" id="metaTheme" content="#F7F9FC">

    <!-- ============================================================
         LE SCRIPT ANTI-CLIGNOTEMENT
         ============================================================
         Ce script minuscule est le SEUL de la page à se trouver dans
         l'en-tête, et c'est volontaire.

         app.js est chargé tout en bas, après le contenu : c'est la
         bonne pratique, la page s'affiche sans l'attendre. Mais si le
         choix « sombre » n'était appliqué que par app.js, le navigateur
         aurait déjà peint la page en clair — le visiteur verrait un
         éclair blanc à chaque ouverture. Dans une salle sombre, c'est
         désagréable au point qu'on croit à un bug.

         Placé ici, ce script s'exécute AVANT le premier pixel.
         Il ne fait qu'une chose, et il ne doit jamais en faire plus.
         ============================================================ -->
    <script>
      try {
        var t = localStorage.getItem("agenda-theme");
        if (t === "dark" || t === "light") {
          document.documentElement.setAttribute("data-theme", t);
        }
      } catch (e) { /* navigation privée : on garde le thème du téléphone */ }
    </script>

    <!-- Le manifeste : c'est lui qui rend la page installable -->
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="icones/icone-192.png">
    <link rel="apple-touch-icon" href="icones/icone-192.png">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
    <link rel="stylesheet" href="style.css">
  </head>

  <body>
    <div class="wrap">

      <!-- ===== Bandeau de l'événement ===== -->
      <header class="masthead">
        <!-- Les deux réglages du visiteur, groupés en haut à droite. -->
        <div class="reglages">

          <div class="segment themesw" role="group" aria-label="Thème / Theme">
            <button type="button" id="btnClair" aria-pressed="false" title="Clair">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                   stroke-linecap="round" aria-hidden="true">
                <circle cx="12" cy="12" r="4.2"></circle>
                <path d="M12 2.6v2.2M12 19.2v2.2M4.2 12H2M22 12h-2.2
                         M6.5 6.5 4.9 4.9M19.1 19.1l-1.6-1.6
                         M17.5 6.5l1.6-1.6M4.9 19.1l1.6-1.6"></path>
              </svg>
              <span class="lecteur-ecran" id="labClair"></span>
            </button>
            <button type="button" id="btnSombre" aria-pressed="false" title="Sombre">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                   stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M20.5 14.3A8.6 8.6 0 1 1 9.7 3.5a6.9 6.9 0 0 0 10.8 10.8z"></path>
              </svg>
              <span class="lecteur-ecran" id="labSombre"></span>
            </button>
          </div>

          <div class="segment langsw" role="group" aria-label="Langue / Language">
            <button type="button" id="btnFr" aria-pressed="true">FR</button>
            <button type="button" id="btnEn" aria-pressed="false">EN</button>
          </div>

        </div>
        <p class="eyebrow" id="mSurtitre"></p>
        <h1 id="mTitre"></h1>
        <div class="meta">
          <span id="mTheme"></span>
          <span id="mLieu"></span>
        </div>
      </header>

      <!-- ===== Bandeau d'annonce (masqué tant qu'il n'y a rien à dire) ===== -->
      <div class="annonce" id="annonce" hidden role="status">
        <span class="annonce-tag" id="annonceTag"></span>
        <p id="annonceTexte"></p>
      </div>

      <!-- ===== Barre de statut : que se passe-t-il maintenant ? ===== -->
      <section class="status" id="status" aria-live="polite">
        <span class="status-kicker" id="statusKicker"></span>
        <p class="status-titre" id="statusTitre"></p>
        <p class="status-sous" id="statusSous"></p>
        <p class="status-aussi" id="statusAussi" hidden></p>
      </section>

      <!-- ===== Invitation à s'enregistrer ===== -->
      <div class="inscrire" id="inscrireBandeau" hidden>
        <div class="inscrire-txt">
          <p class="inscrire-titre" id="inscrireTitre"></p>
          <p class="inscrire-detail" id="inscrireDetail"></p>
        </div>
        <button class="inscrire-go" id="inscrireOuvrir" type="button"></button>
        <button class="inscrire-x" id="inscrireMasquer" type="button"></button>
      </div>

      <!-- ===== Onglets des journées ===== -->
      <div class="tabs" role="tablist" id="tabs"></div>

      <div class="daybar">
        <p class="sous-titre" id="sousTitre"></p>
        <button class="filtre" id="btnFiltre" type="button" aria-pressed="false">
          <span aria-hidden="true">★</span> <span id="filtreLabel"></span>
        </button>
      </div>

      <!-- ===== La liste des sessions ===== -->
      <ul class="rail" id="rail"></ul>

      <!-- ===== Informations pratiques ===== -->
      <section class="infos">
        <h2 id="infosTitre"></h2>
        <dl id="infosListe"></dl>

        <details class="howto">
          <summary id="howtoTitre"></summary>
          <div id="howtoCorps"></div>
        </details>

        <p class="credit" id="credit"></p>
      </section>

    </div>

    <button class="jump" id="btnJump" type="button" hidden>
      <i></i> <span id="jumpLabel"></span>
    </button>

    <!-- Bandeau d'installation. Masqué par défaut : le JavaScript décide
         s'il doit apparaître, et sous quelle forme, selon le téléphone. -->
    <aside class="install" id="install" hidden>
      <div class="install-ico" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
             stroke-linecap="round" stroke-linejoin="round">
          <rect x="5" y="2" width="14" height="20" rx="2.5"></rect>
          <line x1="10.5" y1="18.5" x2="13.5" y2="18.5"></line>
        </svg>
      </div>
      <div class="install-txt">
        <p class="install-titre" id="installTitre"></p>
        <p class="install-detail" id="installDetail"></p>
      </div>
      <button class="install-go" id="installGo" type="button" hidden></button>
      <button class="install-x" id="installX" type="button"></button>
    </aside>

    <!-- ===== Le formulaire d'enregistrement, en plein écran ===== -->
    <div class="panneau" id="inscrirePanneau" hidden role="dialog" aria-modal="true"
         aria-labelledby="formTitre">
      <div class="panneau-boite">

        <header class="panneau-tete">
          <h2 id="formTitre"></h2>
          <button class="panneau-x" id="formFermer" type="button"></button>
        </header>

        <!-- Mode « formulaire Microsoft » : ton introduction et ton avis,
             puis le formulaire de Microsoft dans un cadre. -->
        <div class="cadre-zone" id="cadreZone" hidden>

          <!-- LE RETOUR D'UN VISITEUR DÉJÀ ENREGISTRÉ.
               Placé TOUT EN HAUT, avant le formulaire, et c'est le point
               essentiel : sur iPhone, l'application posée sur l'écran
               d'accueil ne partage pas sa mémoire avec Safari. Quelqu'un
               qui s'est enregistré dans Safari puis installe l'icône
               retombe sur un compartiment vide. Le widget ne peut pas le
               reconnaître — mais il ne doit pas pour autant lui redemander
               de tout remplir. Un appui suffit. -->
          <div class="deja" id="dejaZone">
            <p class="deja-titre" id="dejaTitre"></p>
            <button type="button" class="deja-go" id="cadreDeja"></button>
          </div>

          <p class="cadre-ou" id="cadreOu"></p>

          <p class="form-intro" id="cadreIntro"></p>

          <section class="avis">
            <h3 id="cadreAvisTitre"></h3>
            <p id="cadreAvisTexte"></p>
          </section>

          <div class="cadre-boite">
            <iframe id="cadreForm" title="" loading="lazy"
                    allow="fullscreen" referrerpolicy="no-referrer"></iframe>
          </div>

          <button type="button" class="form-envoyer" id="cadreTermine"></button>
          <p class="form-note" id="cadreNote"></p>
        </div>

        <form class="form" id="formInscription" novalidate>
          <p class="form-intro" id="formIntro"></p>

          <!-- Les quatre champs reprennent EXACTEMENT le questionnaire :
               nom et prénoms réunis, qualité, e-mail et téléphone
               facultatifs. Un formulaire qui diverge de son questionnaire
               produit deux jeux de données impossibles à rapprocher. -->
          <label class="champ">
            <span class="champ-nom" id="labNom"></span>
            <input type="text" id="fNom" name="nom" autocomplete="name" required>
          </label>

          <label class="champ">
            <span class="champ-nom" id="labQualite"></span>
            <select id="fQualite" name="qualite" required></select>
          </label>

          <label class="champ" id="champAutre" hidden>
            <span class="champ-nom" id="labAutre"></span>
            <input type="text" id="fAutre" name="autre">
          </label>

          <label class="champ">
            <span class="champ-nom" id="labEmail"></span>
            <input type="email" id="fEmail" name="email" autocomplete="email" inputmode="email">
          </label>

          <label class="champ">
            <span class="champ-nom" id="labTel"></span>
            <input type="tel" id="fTel" name="telephone" autocomplete="tel" inputmode="tel">
          </label>

          <!-- L'avis de confidentialité, écrit depuis programme.json -->
          <section class="avis">
            <h3 id="avisTitre"></h3>
            <p id="avisTexte"></p>
            <p id="avisDroits"></p>
          </section>

          <label class="consent">
            <input type="checkbox" id="fConsent" name="consent" required>
            <span id="labConsent"></span>
          </label>

          <p class="form-erreur" id="formErreur" hidden role="alert"></p>

          <button type="submit" class="form-envoyer" id="formEnvoyer"></button>
          <p class="form-note" id="formNote"></p>
        </form>

        <!-- L'écran de confirmation, une fois l'envoi réussi -->
        <div class="merci" id="formMerci" hidden>
          <div class="merci-ico" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round">
              <path d="M20 6L9 17l-5-5"></path>
            </svg>
          </div>
          <h3 id="merciTitre"></h3>
          <p id="merciTexte"></p>
          <button type="button" class="merci-go" id="merciFermer"></button>
        </div>

      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
